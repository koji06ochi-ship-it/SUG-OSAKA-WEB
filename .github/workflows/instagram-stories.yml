name: Instagram stories (approval gated)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: instagram-stories
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'koji06ochi-ship-it/SUG-OSAKA-WEB' && github.event.repository.private == false && github.ref == 'refs/heads/master' && vars.INSTAGRAM_STORIES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read stories without logging credentials
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ vars.INSTAGRAM_USER_ID }}
          INSTAGRAM_LOGIN_MODE: ${{ vars.INSTAGRAM_LOGIN_MODE }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
        run: node scripts/fetch-stories.mjs "$RUNNER_TEMP/stories.json"
      - name: Update data branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin stories-data >/dev/null; then
            git fetch origin stories-data
            git worktree add "$RUNNER_TEMP/story-data" FETCH_HEAD
          else
            git worktree add --detach "$RUNNER_TEMP/story-data"
            cd "$RUNNER_TEMP/story-data"
            git switch --orphan stories-data
          fi
          cd "$RUNNER_TEMP/story-data"
          cp "$RUNNER_TEMP/stories.json" stories.json
          git add stories.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh active Instagram stories'
          git push origin HEAD:refs/heads/stories-data
