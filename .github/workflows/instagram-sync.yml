name: Sync Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${INSTAGRAM_ACCESS_TOKEN:-}" ]; then
            echo "INSTAGRAM_ACCESS_TOKEN is not configured."
            exit 1
          fi

          mkdir -p data
          API_URL="https://graph.instagram.com/me/media?fields=id,caption,media_type,media_url,thumbnail_url,permalink,timestamp&limit=6&access_token=${INSTAGRAM_ACCESS_TOKEN}"

          curl --fail --silent --show-error "$API_URL" -o /tmp/instagram.json

          jq --arg updated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             '{updated_at:$updated_at,data:(.data // [])}'             /tmp/instagram.json > data/instagram.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/instagram.json; then
            echo "No Instagram changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram.json
          git commit -m "Sync Instagram feed"
          git push
