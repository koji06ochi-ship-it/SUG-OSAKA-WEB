<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>S.u.G WALK R7｜正式5画面＋大阪水上観光 統合版</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #020205; overflow: hidden; }
    .unified-root {
      width: 100%; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: stretch;
      background: radial-gradient(circle at 25% 15%, rgba(255,46,147,0.14), transparent 45%), #020205;
    }
    .phone-frame {
      position: relative; width: 100%; max-width: 430px; height: 100%; min-height: 0; background: #040308;
      box-shadow: 0 0 64px rgba(0,0,0,0.96), 0 0 0 1px rgba(255,46,147,0.34); overflow: hidden;
    }
    .screen-frame {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; border: none; background: #040308;
      opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.16s ease;
    }
    .screen-frame.active { opacity: 1; pointer-events: auto; z-index: 5; }
    /* Mobile Safari: keep the five official tabs outside the iframe viewport. */
    .phone-frame { padding-bottom: 74px; }
    .screen-frame { bottom: 74px; height: calc(100% - 74px); }
    .preview-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 74px; z-index: 30; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); padding: 7px 4px calc(7px + env(safe-area-inset-bottom, 0px)); background: #08050e; border-top: 1px solid #f32a8d; box-shadow: 0 -6px 20px #000b; }
    .preview-tab { border: 0; border-radius: 8px; background: transparent; color: #aaa2bc; font: 600 11px -apple-system, sans-serif; min-width:0; min-height: 42px; }
    .preview-tab[aria-current="page"] { color: #ff479f; background: #361129; box-shadow: inset 0 2px #ff479f; }

  </style>
</head>
<body>
  <div class="unified-root">
    <div class="phone-frame" aria-label="S.u.G WALK R7 正式5画面統合アプリ">
      <iframe id="frame-home" class="screen-frame active" title="① ホーム"></iframe>
      <iframe id="frame-map" class="screen-frame" title="② マップ" allow="geolocation; accelerometer; gyroscope"></iframe>
      <iframe id="frame-meet" class="screen-frame" title="③ 出会う"></iframe>
      <iframe id="frame-log" class="screen-frame" title="④ 記録"></iframe>
      <iframe id="frame-settings" class="screen-frame" title="⑤ 設定"></iframe>
      <nav class="preview-nav" aria-label="5画面切替"><button class="preview-tab" data-tab="home" aria-current="page">ホーム</button><button class="preview-tab" data-tab="map">マップ</button><button class="preview-tab" data-tab="meet">出会う</button><button class="preview-tab" data-tab="log">記録</button><button class="preview-tab" data-tab="settings">設定</button></nav>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      
      var TAB_KEYS = ['home', 'map', 'meet', 'log', 'settings'];
      var currentTab = 'home';

      TAB_KEYS.forEach(function (key) {
        var el = document.getElementById('frame-' + key);
        if (el) {
          el.addEventListener('load', function () {
            try {
              var doc = el.contentDocument;
              var style = doc.createElement('style');
              style.textContent = '.bottom-nav{display:none!important} html,body,.app-viewport,.phone-shell{height:100%!important;min-height:0!important}';
              doc.head.appendChild(style);
            } catch (e) { /* Fall back to original screen styling */ }
            if (key === 'map' && currentTab === 'map') {
              el.contentWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            }
          });
          el.src = key === 'map' ? 'map.html?v=r7-sug-compass-20261123e' : key + '.html';
        }
      });

      function switchTab(tab) {
        if (TAB_KEYS.indexOf(tab) === -1) return;
        currentTab = tab;
        document.querySelectorAll('.preview-tab').forEach(function (button) {
          if (button.dataset.tab === tab) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        const mapWindow = document.getElementById('frame-map').contentWindow;
        try { mapWindow.dispatchEvent(new mapWindow.Event('sug:tabChanged')); } catch (e) { /* Map not ready yet */ }
        TAB_KEYS.forEach(function (k) {
          var el = document.getElementById('frame-' + k);
          if (el) el.classList.toggle('active', k === tab);
        });
        if (tab === 'map') {
          // Wait until the iframe has a measurable viewport before Mapbox resize.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              mapWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            });
          });
        }
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sugWalkR7) {
          try { window.webkit.messageHandlers.sugWalkR7.postMessage({ action: 'onActiveTabChanged', payload: { tab: tab } }); } catch (e) {}
        }
      }

      window.addEventListener('message', function (ev) {
        if (ev.origin !== location.origin || !TAB_KEYS.some(k => document.getElementById('frame-'+k).contentWindow === ev.source) || !ev.data) return;
        if (ev.data.type === 'SUG_SWITCH_TAB' && ev.data.tab) {
          switchTab(ev.data.tab);
        } else if (ev.data.type === 'SUG_SYNC_LANG' && ev.data.lang) {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_APPLY_LANG', lang: ev.data.lang }, '*');
          });
        } else if (ev.data.type === 'SUG_EVENTS_UPDATED') {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_EVENTS_UPDATED' }, '*');
          });
        }
      });

      document.querySelectorAll('.preview-tab').forEach(function (button) {
        button.addEventListener('click', function () { switchTab(button.dataset.tab); });
      });

      window.SUGR7UnifiedBridge = {
        switchTab: switchTab,
        getActiveTab: function () { return currentTab; }
      };
    })();
  </script>
</body>
</html>
