<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>S.u.G WALK R7｜正式5画面＋大阪水上観光 統合版</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #020205; overflow: hidden; }
    .unified-root {
      width: 100%; height: 100vh; height: 100dvh; display: flex; justify-content: center; align-items: stretch;
      background: radial-gradient(circle at 25% 15%, rgba(255,46,147,0.14), transparent 45%), #020205;
    }
    .phone-frame {
      position: relative; width: 100%; max-width: 430px; height: 100%; min-height: 0; background: #040308;
      box-shadow: 0 0 64px rgba(0,0,0,0.96), 0 0 0 1px rgba(255,46,147,0.34); overflow: hidden;
    }
    .screen-frame {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: block; border: none; background: #040308;
      opacity: 0; pointer-events: none; z-index: 1; transition: opacity 0.16s ease;
    }
    .screen-frame.active { opacity: 1; pointer-events: auto; z-index: 5; }
    /* Mobile Safari: keep the five official tabs outside the iframe viewport. */
    .phone-frame { padding-bottom: 74px; }
    .screen-frame { bottom: 74px; height: calc(100% - 74px); }
    .preview-nav { position: absolute; bottom: 0; left: 0; right: 0; height: 74px; z-index: 30; display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); padding: 7px 4px calc(7px + env(safe-area-inset-bottom, 0px)); background: #08050e; border-top: 1px solid #f32a8d; box-shadow: 0 -6px 20px #000b; }
    .preview-tab { border: 0; border-radius: 8px; background: transparent; color: #aaa2bc; font: 600 11px -apple-system, sans-serif; min-width:0; min-height: 42px; }
    .preview-tab[aria-current="page"] { color: #ff479f; background: #361129; box-shadow: inset 0 2px #ff479f; }

  
    .sug-wallet{position:absolute;top:0;left:0;right:0;height:48px;z-index:25;display:flex;align-items:center;justify-content:space-around;background:#10091e;border-bottom:1px solid #ff479f;color:white;font:600 12px -apple-system,sans-serif;padding:4px 8px}.sug-wallet button{background:none;border:0;color:inherit;font:inherit;padding:6px}.sug-wallet b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;color:#08050e;margin-right:5px}.sug-wallet .s{background:#ff479f}.sug-wallet .u{background:#5ae8ff}.sug-wallet .g{background:#e8be63}.screen-frame{top:48px;height:calc(100% - 122px)}.sug-wallet-info{position:absolute;top:48px;left:8px;right:8px;z-index:26;padding:16px;border:1px solid #ff479f;border-radius:12px;background:#10091e;color:white;font:14px -apple-system,sans-serif}.sug-wallet-info[hidden]{display:none}

.title-launch{background:#241029!important;border:1px solid #ff479f!important;border-radius:8px!important;font-size:11px!important}.title-panel{position:absolute;inset:48px 0 74px;z-index:29;background:#10091e;color:white;padding:16px;overflow:auto;font:14px -apple-system,sans-serif}.title-panel[hidden]{display:none}.title-panel button,.title-panel select{color:white;background:#29122e;border:1px solid #ff479f;border-radius:8px;padding:8px;margin:4px}.title-panel article{border-bottom:1px solid #ff479f44;padding:12px 0}.title-panel h2{color:#ff479f}.title-panel small{color:#ddd}.title-panel .title-card{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>
<body>
  <div class="unified-root">
    <div class="phone-frame" aria-label="S.u.G WALK R7 正式5画面統合アプリ">
      <div class="sug-wallet" aria-label="S.u.G コイン"><button class="title-launch" id="title-launch" type="button">謎称号</button><button type="button" data-coin="S"><b class="s">S</b><span>—</span></button><button type="button" data-coin="u"><b class="u">u</b><span>—</span></button><button type="button" data-coin="G"><b class="g">G</b><span>—</span></button></div><section class="sug-wallet-info" hidden aria-live="polite"><strong></strong><p>残高未接続（検証版）。実際のコインはまだ付与・消費されません。</p><button type="button">閉じる</button></section><section class="title-panel" hidden aria-label="謎の称号図鑑"><button type="button" id="title-close">×</button><select id="title-lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option></select><h2 id="title-heading"></h2><p id="title-progress"></p><p id="title-equipped"></p><p id="title-notice" role="status"></p><div id="title-list"></div></section><iframe id="frame-home" class="screen-frame active" title="① ホーム"></iframe>
      <iframe id="frame-map" class="screen-frame" title="② マップ" allow="geolocation; accelerometer; gyroscope"></iframe>
      <iframe id="frame-meet" class="screen-frame" title="③ 出会う"></iframe>
      <iframe id="frame-log" class="screen-frame" title="④ 記録"></iframe>
      <iframe id="frame-settings" class="screen-frame" title="⑤ 設定"></iframe>
      <button id="home-character-encounter" type="button" hidden aria-label="出現中のキャラクターをマップで確認" style="position:absolute;z-index:20;right:10px;bottom:88px;display:none;align-items:center;gap:7px;max-width:210px;padding:7px 10px;border:1px solid #ff479f;border-radius:12px;background:#10091eee;color:white;text-align:left;font:600 11px -apple-system,sans-serif;box-shadow:0 0 12px #ff479f55"><img alt="" style="width:42px;height:42px;object-fit:cover;border-radius:50%"><span></span></button>
      <nav class="preview-nav" aria-label="5画面切替"><button class="preview-tab" data-tab="home" aria-current="page">ホーム</button><button class="preview-tab" data-tab="map">マップ</button><button class="preview-tab" data-tab="meet">出会う</button><button class="preview-tab" data-tab="log">記録</button><button class="preview-tab" data-tab="settings">設定</button></nav>
    </div>
  </div>
  <script>
    (function () {
      'use strict';
      
      
      var walletInfo=document.querySelector('.sug-wallet-info');
      var coinLabels={S:'S｜応援・LIVE視聴',u:'u｜散歩・店舗・観光',G:'G｜ゲーム'};
      document.querySelectorAll('.sug-wallet [data-coin]').forEach(function(button){button.addEventListener('click',function(){walletInfo.querySelector('strong').textContent=coinLabels[button.dataset.coin];walletInfo.hidden=false;});});
      walletInfo.querySelector('button').addEventListener('click',function(){walletInfo.hidden=true;});
      var TAB_KEYS = ['home', 'map', 'meet', 'log', 'settings'];
      var currentTab = 'home';
      var encounter = document.getElementById('home-character-encounter');
      var encounterData = null;
      function paintEncounter(){
        var ch=encounterData && encounterData.characters[0];
        var visible=currentTab==='home' && !!ch;
        encounter.hidden=!visible; encounter.style.display=visible?'flex':'none';
        if(!visible)return;
        encounter.querySelector('img').src=ch.img;
        encounter.querySelector('span').textContent=(encounterData.mode==='gps'?'周辺で出現中':'MAP探索中')+'：'+ch.character+' / '+ch.spotName;
      }
      encounter.addEventListener('click',function(){switchTab('map');});


      TAB_KEYS.forEach(function (key) {
        var el = document.getElementById('frame-' + key);
        if (el) {
          el.addEventListener('load', function () {
            try {
              var doc = el.contentDocument;
              var style = doc.createElement('style');
              style.textContent = '.bottom-nav{display:none!important} html,body,.app-viewport,.phone-shell{height:100%!important;min-height:0!important}';
              doc.head.appendChild(style);
            } catch (e) { /* Fall back to original screen styling */ }
            if (key === 'map' && currentTab === 'map') {
              el.contentWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            }
          });
          el.src = key === 'map' ? 'map.html?v=r7-character-bridge-20261124' : key + '.html';
        }
      });

      function switchTab(tab) {
        if (TAB_KEYS.indexOf(tab) === -1) return;
        currentTab = tab;
        paintEncounter();
        document.querySelectorAll('.preview-tab').forEach(function (button) {
          if (button.dataset.tab === tab) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        const mapWindow = document.getElementById('frame-map').contentWindow;
        try { mapWindow.dispatchEvent(new mapWindow.Event('sug:tabChanged')); } catch (e) { /* Map not ready yet */ }
        TAB_KEYS.forEach(function (k) {
          var el = document.getElementById('frame-' + k);
          if (el) el.classList.toggle('active', k === tab);
        });
        if (tab === 'map') {
          // Wait until the iframe has a measurable viewport before Mapbox resize.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              mapWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            });
          });
        }
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sugWalkR7) {
          try { window.webkit.messageHandlers.sugWalkR7.postMessage({ action: 'onActiveTabChanged', payload: { tab: tab } }); } catch (e) {}
        }
      }

      window.addEventListener('message', function (ev) {
        if (ev.origin !== location.origin || !TAB_KEYS.some(k => document.getElementById('frame-'+k).contentWindow === ev.source) || !ev.data) return;
        if (ev.data.type === 'SUG_CHARACTER_SPAWNS' && ev.source===document.getElementById('frame-map').contentWindow) {
          if (!Array.isArray(ev.data.characters)) return;
          encounterData={mode:ev.data.mode,characters:ev.data.characters.filter(ch=>ch && typeof ch.character==='string' && typeof ch.spotName==='string' && typeof ch.img==='string' && /^data:image\/jpeg;base64,/.test(ch.img)).slice(0,3)};
          paintEncounter();
        } else if (ev.data.type === 'SUG_SWITCH_TAB' && ev.data.tab) {
          switchTab(ev.data.tab);
        } else if (ev.data.type === 'SUG_SYNC_LANG' && ev.data.lang) {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_APPLY_LANG', lang: ev.data.lang }, '*');
          });
        } else if (ev.data.type === 'SUG_EVENTS_UPDATED') {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_EVENTS_UPDATED' }, '*');
          });
        }
      });

      document.querySelectorAll('.preview-tab').forEach(function (button) {
        button.addEventListener('click', function () { switchTab(button.dataset.tab); });
      });

      window.SUGR7UnifiedBridge = {
        switchTab: switchTab,
        getActiveTab: function () { return currentTab; }
      };
    })();
  </script>
<script>
(function(){'use strict';
const catalog=[["sole","靴底の破壊神","Sole Destroyer","鞋底毁灭之神",1],["repeat","地球の再放送","Earth on Repeat","地球重播中",1],["bridge","橋の親戚","Bridge Cousin","大桥的亲戚",1],["boat","ほぼアクアライナー","Basically a Boat","人形观光船",2],["tenma","天満の備品","Property of Tenma","天满固定资产",3],["coffee","歩くカフェイン","Walking Caffeine","行走的咖啡因",1],["castle","非公認城主","Unofficial Castle Lord","野生城主",3],["sofa","ソファと業務提携","Sofa Business Partner","沙发战略合作伙伴",0],["loss","負け方のプロ","Master of Losing","花式失败大师",2],["copy","現実の無駄遣い","Reality Wasted","现实浪费大师",2],["live","頼まれてない広報部長","Unappointed PR Director","无人任命的宣传部长",2],["million","足だけ別人格","My Legs Have a Mind of Their Own","双腿拥有独立人格",4]];
const dict={ja:{book:'謎称号',heading:'謎の称号図鑑',locked:'？？？',secret:'獲得条件は秘密',equip:'装着',equipped:'装着中',none:'未装着',preview:'演出テスト（獲得なし）',notice:'おめでとうございます。天満の備品に認定されました。なお、給料は出ません。',pending:'実際の行動との連携は準備中',r:['普通','まあまあ意味不明','だいぶおかしい','もはや説明不可能','大阪でも理解不能']},en:{book:'Odd titles',heading:'Absurd Title Collection',locked:'???',secret:'Unlock condition: secret',equip:'Equip',equipped:'Equipped',none:'None',preview:'Preview ceremony (no unlock)',notice:'Congratulations! You are now officially property of Tenma. Salary: zero.',pending:'Real activity tracking is not connected yet.',r:['Normal','Rather baffling','Quite ridiculous','Beyond explanation','Even Osaka is confused']},zh:{book:'奇怪称号',heading:'奇怪称号图鉴',locked:'？？？',secret:'解锁条件保密',equip:'佩戴',equipped:'已佩戴',none:'未佩戴',preview:'颁奖演示（不解锁）',notice:'恭喜！您已正式成为天满的固定资产。工资：零元。',pending:'实际活动数据尚未连接。',r:['普通','有点莫名其妙','相当离谱','无法解释','连大阪都无法理解']}};
const panel=document.querySelector('.title-panel'),launch=document.getElementById('title-launch'),select=document.getElementById('title-lang'),list=document.getElementById('title-list'),note=document.getElementById('title-notice');
let lang='ja';const normalize=v=>String(v).toLowerCase().startsWith('zh')?'zh':String(v).toLowerCase().startsWith('en')?'en':'ja';
function read(){try{const raw=JSON.parse(localStorage.getItem('sug.r7.titles.v1')||'{}');return {unlocked:Array.isArray(raw.unlocked)?catalog.filter(x=>raw.unlocked.includes(x[0])).map(x=>x[0]):[],equipped:typeof raw.equipped==='string'?raw.equipped:null};}catch(e){return{unlocked:[],equipped:null};}}
function render(){const t=dict[lang],s=read(),i={ja:1,en:2,zh:3}[lang];launch.textContent=t.book;select.value=lang;document.getElementById('title-heading').textContent=t.heading;document.getElementById('title-progress').textContent=s.unlocked.length+' / '+catalog.length+' · '+t.pending;const eq=catalog.find(x=>x[0]===s.equipped&&s.unlocked.includes(x[0]));document.getElementById('title-equipped').textContent=t.equipped+'：'+(eq?eq[i]:t.none);list.replaceChildren();for(const x of catalog){const a=document.createElement('article'),h=document.createElement('div'),b=document.createElement('strong'),small=document.createElement('small');h.className='title-card';const owned=s.unlocked.includes(x[0]);b.textContent=owned?x[i]:t.locked;small.textContent=t.r[x[4]]+' · '+t.secret;h.append(b);if(owned){const btn=document.createElement('button');btn.textContent=t.equip;btn.onclick=()=>{const current=read();if(!current.unlocked.includes(x[0]))return;try{localStorage.setItem('sug.r7.titles.v1',JSON.stringify({...current,equipped:x[0]}));render();}catch(e){note.textContent='Storage unavailable';}};h.append(btn);}a.append(h,small);list.append(a);}const demo=document.createElement('button');demo.textContent=t.preview;demo.onclick=()=>{note.textContent=t.notice;};list.append(demo);}
launch.onclick=()=>{panel.hidden=false;note.textContent='';render();};document.getElementById('title-close').onclick=()=>{panel.hidden=true;};select.onchange=()=>{lang=normalize(select.value);note.textContent='';render();};window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='SUG_SYNC_LANG'||!Array.from(document.querySelectorAll('.screen-frame')).some(f=>f.contentWindow===e.source))return;lang=normalize(e.data.lang);note.textContent='';render();});render();
})();
</script></body>
</html>
