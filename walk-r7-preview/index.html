      var walletInfo=document.querySelector('.sug-wallet-info');

      document.querySelectorAll('.sug-wallet [data-coin]').forEach(function(button){button.addEventListener('click',function(){walletInfo.querySelector('strong').textContent=coinLabels[button.dataset.coin];walletInfo.hidden=false;});});
      walletInfo.querySelector('button').addEventListener('click',function(){walletInfo.hidden=true;});
      var TAB_KEYS = ['home', 'map', 'meet', 'log', 'settings'];
      var currentTab = 'home';
      var encounter = document.getElementById('home-character-encounter');
      var encounterData = null;
      function paintEncounter(){
        var ch=encounterData && encounterData.characters[0];
        var visible=currentTab==='home' && !!ch;
        encounter.hidden=!visible; encounter.style.display=visible?'flex':'none';
        if(!visible)return;
        encounter.querySelector('img').src=ch.img;
        encounter.querySelector('span').textContent=(encounterData.mode==='gps'?'周辺で出現中':'MAP探索中')+'：'+ch.character+' / '+ch.spotName;
      }
      encounter.addEventListener('click',function(){switchTab('map');});


      TAB_KEYS.forEach(function (key) {
        var el = document.getElementById('frame-' + key);
        if (el) {
          el.addEventListener('load', function () {
            try {
              var doc = el.contentDocument;
              var style = doc.createElement('style');
              style.textContent = '.bottom-nav{display:none!important} html,body,.app-viewport,.phone-shell{height:100%!important;min-height:0!important}';
              doc.head.appendChild(style);
            } catch (e) { /* Fall back to original screen styling */ }
            if (key === 'map' && currentTab === 'map') {
              el.contentWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            }
          });
          el.src = key === 'map' ? 'map.html?v=r7-character-bridge-20261124' : key + '.html';
        }
      });

      function switchTab(tab) {
        if (TAB_KEYS.indexOf(tab) === -1) return;
        currentTab = tab;
        paintEncounter();
        document.querySelectorAll('.preview-tab').forEach(function (button) {
          if (button.dataset.tab === tab) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        const mapWindow = document.getElementById('frame-map').contentWindow;
        try { mapWindow.dispatchEvent(new mapWindow.Event('sug:tabChanged')); } catch (e) { /* Map not ready yet */ }
        TAB_KEYS.forEach(function (k) {
          var el = document.getElementById('frame-' + k);
          if (el) el.classList.toggle('active', k === tab);
        });
        if (tab === 'map') {
          // Wait until the iframe has a measurable viewport before Mapbox resize.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              mapWindow.postMessage({ type: 'sug-r7-map-visible' }, '*');
            });
          });
        }
        if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sugWalkR7) {
          try { window.webkit.messageHandlers.sugWalkR7.postMessage({ action: 'onActiveTabChanged', payload: { tab: tab } }); } catch (e) {}
        }
      }

      window.addEventListener('message', function (ev) {
        if (ev.origin !== location.origin || !TAB_KEYS.some(k => document.getElementById('frame-'+k).contentWindow === ev.source) || !ev.data) return;
        if (ev.data.type === 'SUG_CHARACTER_SPAWNS' && ev.source===document.getElementById('frame-map').contentWindow) {
          if (!Array.isArray(ev.data.characters)) return;
          encounterData={mode:ev.data.mode,characters:ev.data.characters.filter(ch=>ch && typeof ch.character==='string' && typeof ch.spotName==='string' && typeof ch.img==='string' && /^data:image\/jpeg;base64,/.test(ch.img)).slice(0,3)};
          paintEncounter();
        } else if (ev.data.type === 'SUG_SWITCH_TAB' && ev.data.tab) {
          switchTab(ev.data.tab);
        } else if (ev.data.type === 'SUG_SYNC_LANG' && ev.data.lang) {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_APPLY_LANG', lang: ev.data.lang }, '*');
          });
        } else if (ev.data.type === 'SUG_EVENTS_UPDATED') {
          TAB_KEYS.forEach(function (k) {
            var el = document.getElementById('frame-' + k);
            if (el && el.contentWindow) el.contentWindow.postMessage({ type: 'SUG_EVENTS_UPDATED' }, '*');
          });
        }
      });

      document.querySelectorAll('.preview-tab').forEach(function (button) {
        button.addEventListener('click', function () { switchTab(button.dataset.tab); });
      });

      window.SUGR7UnifiedBridge = {
        switchTab: switchTab,
        getActiveTab: function () { return currentTab; }
      };
    })();
  </script>
